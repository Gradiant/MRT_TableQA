explainer:
  template: |
    You are an AI assistant tasked with solving questions using a table.{}
    You have the following columns available: {}
    Your task is to break down the steps required to answer the following question: {}
    Please list a maximum of {} steps required to manipulate the data to answer the question, but the best solution is the one that uses the minimum number of steps. 
    The first steps should be casting or removing missing data only when it is needed for one or more columns. (Missing data are only cases of null, NaN, NaT, empty string, etc.)
    It is important that the last step should induce to give a answer type according to the type the question implicitly requires (for example a number, boolean (True/False), a string, a list, etc.)
    Don't round numbers unless is explictly requested in the query.
    Don't write code, only precise and clear explanations.
    Make sure the response is in English, but make sure the column names are in their original language.
    Be very specific and clear in describing how each step manipulates the table. Separate the instructions in sentences separated by a "." symbol. Don't use enumerations, don't enumerate the steps, don't write a header or introduction, don't give code examples. Use complete column names to refer to the columns. Just write down the instructions. 
    Many columns may have missing data or data that must be casted or preprocessed to avoid throwing exceptions.
    
    This are the first rows of the dataframe to understand the type of data they contain
    {}
    
    The output format of your response must be a JSON with only the three following fields that are lists:
    - instructions: the list of instructions that must be applied
    - columns: the list with the name of the columns in which the instructions will be applied (try to put all of them)
    - filter_values: the list that contains the values that will be used to filter or to be accessed in the columns (try to put all of them)
    
    Do not forget to provide a valid JSON. Use ` within strings to ensure valid JSONs are generated
    
  correct_prompt: True
  template_correction: |
    You are an AI assistant. You will receive the column names of a table, a question, and a list of reasoning instructions to follow for obtaining the answer to that question.
    Your task is to review the instructions and correct them because sometimes those instructions are incorrect.{}
    The table has this columns: {}
    The question was: {}
    The original instructions to be corrected are: {}
    Delete filtering instructions that are not needed. Be careful of not deleting useful filters that are related with the question (e.g. entities or characteristics that can be used to filter the table) or missing values.
    The last instruction should induce to give a answer type according to the type the question implicitly requires (for example a number, boolean (True/False), a string, a list, etc.)
    Be very specific and clear in describing how each step manipulates the table. The result must remain as a list of strings, as the original instructions. Don't write a header or introduction, don't give code examples. Use complete column names to refer to the columns. Just write down the instructions. Pay attention as many columns have missing data or data that must be casted or preprocessed to avoid throwing exceptions.
    If everything is correct, just leave the same instructions, don't change anything.    
    
    This are the first rows of the dataframe to understand the type of data they contain
    {}
    
    The output format of your response must be a JSON with only the three following fields that are lists:
    - instructions: the list of instructions that must be applied
    - columns: the list with the name of the columns in which the instructions will be applied (try to put all of them)
    - filter_values: the list that contains the values that will be used to filter or to be accessed in the columns (try to put all of them)
    
    Do not forget to provide a valid JSON. Use ' within strings to ensure valid JSONs are generated
    
  trash: trash/explainer
  trash_file: trash.jsonl
  max_len_trash: 100


coder:
  template: >
        You are an AI assistant tasked with generating Python code using the pandas library to manipulate a DataFrame. Your goal is to complete a specific function, `parse_dataframe`, to answer a question based on the DataFrame's data.

        The original question asked was: {}.

        You will be working with a pandas DataFrame, assumed to be named `df`. This DataFrame has the following columns: {}.

        **Available Helper Functions:**
        Before you begin implementing the steps, note that you have access to the following helper Python functions. These functions are defined in the environment where `parse_dataframe` will run. Review them, as they might provide efficient ways to perform some if not all of the required operations described in the steps.

        ```python
        # <<< AVAILABLE HELPER FUNCTION DEFINITIONS START >>>
        # Helper functions (names and descriptions) provided for the task will be defined here.
        # These functions are accessible by name within the parse_dataframe implementation.

        {}
        # <<< AVAILABLE HELPER FUNCTION DEFINITIONS END >>>
        ```

        You have to follow the following steps. Try to use the helper functions if they can assist you with the steps. 

        Steps: {}.

        **Your Task:**
        Your primary task is to complete the Python function `parse_dataframe` shown below. This function takes the DataFrame `df` as input and should return a string result based on the manipulation steps.

        **Guidance on Implementation:**
        1.  **Consider Helpers:** As you translate the manipulation steps into code *inside* the `parse_dataframe` function, first consider if any of the helper functions defined above can be used to accomplish the step or parts of it.
        2.  **Apply Helpers Where Suitable:** If a helper function accurately addresses the requirement of a step, call that function within `parse_dataframe`.
        3.  **Use Pandas Otherwise:** If no helper function is suitable for a particular operation, implement it using standard pandas methods and attributes.

        **Crucial Constraints:**
        *   **Target Function:** All your generated implementation logic must reside *inside* the `parse_dataframe` function body. **Do not** include the helper function definitions themselves in your final output; assume they are already defined and accessible.
        *   **`groupby` Restriction:** You are explicitly **not allowed** to use the `df.groupby()` method in your implementation. Using pandas groupby is totally prohibited You can use value_counts instead.
        *   **Column Names:** You must use the DataFrame column names exactly as provided:.
        *   **Output Variable:** The final calculated value inside `parse_dataframe` must be assigned to a variable named `result`.
        *   **Output Type:** The `parse_dataframe` function must return a single string. If the `result` variable holds a Python list, boolean, integer, or float, it **must** be cast to its string representation before returning (e.g., `str([1, 2])`, `str(True)`, `str(10)`, `str(3.14)`). Do not return descriptive sentences.

        Your outuput should be composed by two things
        1) First the explanation and reasoning that lead you to doing what you did in a step by step decision making manner
        2) The actual code in a ```python```block (the block is important)

        Complete the following Python function template:

        ```python
        import pandas as pd
        # Assume helper functions (defined externally) are accessible here

        def parse_dataframe(df: pd.DataFrame) -> str:
            # <<< MAIN LOGIC IMPLEMENTATION START >>>
            # Implement the data manipulation steps here.
            # Call helper functions (defined externally) where appropriate,
            # otherwise use standard pandas operations (excluding groupby).

            # ... pandas code implementing the steps ...

            # Assign the final outcome to the 'result' variable
            # result = ...

            # <<< MAIN LOGIC IMPLEMENTATION END >>>

            return result
        ```

        Its super important to encase the code in the ```python```block.

  
