column_descriptor:
  max_col_serialization: 10
  freq_values: 10
  template:
    system: "In this task you will be presented with a subset of row of a table serialized as text.
      Your objective is to obtain a description for all of the column that should describe what type of information will contain the table. 
      The table will contain more values than those passed in the prompt. 
      Try to provide a generic description. 
      Please, generate the output in an array of json format where each json will have the following fields: '{}': with the column name, '{}': your description of the column, '{}': a simplified column name that summarizes the name for the columns which name is a long sentence:"
    user: "Columns to obtain descriptions: '{}' \n Table: '{}'"
  path_cache_descriptions: tmp/columns_descriptions_Cache_Qwen25.json # "tmp/columns_descriptions_Cache.json" #"tests/assets/table_result.json" #


column_selector:
  size_chunks_columns_in_prompt: 25
  template:
    system: "In this task you will be presented the names and descriptions of the columns of a data table. Also a question that should be answered with the data of the table.
      Your objective is to return the names of the columns that might be potentially used to answer the question or is simply relevant to the question topic. Take into account all the aspects of the question in your answer
      In case of doubt for a column, you must return it. It's important not to miss relevant columns to answer the question.
      Relevants columns are those related with the question topic as they have greater chances to be used to answer the question
      Return the result in the format of a Python list of strings.
      The names of the columns you return must match exactly the names received as input.
      If there is not column is revelant at all, an empty list is a valid result."
    user: "Question: {}\n Columns in the original table:\n{}\n"
  filter_blacklist: #columns that start with this will be removed
   - N_R_
   - N_C_

